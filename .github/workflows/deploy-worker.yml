name: Deploy license Worker

on:
  push:
    branches: [main]
    paths:
      - 'license_worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-license-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check configuration
        working-directory: license_worker
        run: |
          if grep -q REPLACE_WITH_KV_NAMESPACE_ID wrangler.toml; then
            echo "wrangler.toml still has the KV namespace placeholder"; exit 1
          fi
          cp worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs

      - name: Deploy to Cloudflare
        working-directory: license_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
