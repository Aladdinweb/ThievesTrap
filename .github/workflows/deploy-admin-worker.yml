name: Deploy admin Worker

on:
  push:
    branches: [main]
    paths:
      - 'admin_worker/**'
      - '.github/workflows/deploy-admin-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-admin-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check configuration
        working-directory: admin_worker
        run: |
          cp worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs

      - name: Deploy to Cloudflare
        working-directory: admin_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
