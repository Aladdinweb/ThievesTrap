name: Deploy family Worker

on:
  push:
    branches: [main]
    paths:
      - 'family_worker/**'
      - '.github/workflows/deploy-family-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-family-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check configuration
        working-directory: family_worker
        run: |
          cp worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs
          grep -q 'new_sqlite_classes' wrangler.toml

      - name: Deploy to Cloudflare
        working-directory: family_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
