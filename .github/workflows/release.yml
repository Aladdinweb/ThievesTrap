name: Release and OTA

# Push a tag like v2.9.2 and this does everything:
#   build signed APK -> GitHub Release + APK attached -> version.json updated on main
on:
  push:
    tags:
      - 'v*.*.*'

# The repo default is read-only (see STATE.md), so grant write explicitly here.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Read version from build.gradle and verify it matches the tag
        id: ver
        run: |
          CODE=$(grep -E '^\s*versionCode\s+[0-9]+' app/build.gradle | head -n1 | grep -oE '[0-9]+')
          NAME=$(grep -E '^\s*versionName\s+"' app/build.gradle | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "build.gradle: versionCode=$CODE versionName=$NAME  tag=$TAG"
          if [ -z "$CODE" ] || [ -z "$NAME" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle"; exit 1
          fi
          if [ "v$NAME" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $NAME in build.gradle. Bump build.gradle, commit, then re-tag."
            exit 1
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # gradle-wrapper.jar is not committed; same step as build.yml
      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 60 -L \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar || \
          curl --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 60 -L \
            "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/thieves_trap.jks
          # JKS magic bytes must be FEEDFEED (PKCS12 breaks the signer)
          MAGIC=$(hexdump -n 4 -e '1/1 "%02X"' app/thieves_trap.jks)
          echo "Keystore magic: $MAGIC"
          [ "$MAGIC" = "FEEDFEED" ] || { echo "::error::Keystore is not JKS"; exit 1; }

      - name: Build signed release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$(pwd)/app/thieves_trap.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      # Dynamic discovery, never hardcode the filename (see STATE.md)
      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          [ -n "$APK" ] || { echo "::error::No release APK found"; find app/build/outputs -type f; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          # Same sanity floor idea as UpdateManager.MIN_APK_BYTES
          [ "$SIZE" -gt 1000000 ] || { echo "::error::APK suspiciously small"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      # gh CLI is preinstalled on runners: no third-party action to break on Node upgrades
      - name: Create GitHub Release and attach APK
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists (re-run or pre-created draft): uploading APK and publishing"
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --title "Thieves Trap $TAG" \
              --generate-notes \
              --latest
          fi

      - name: Verify the download URL is live before touching version.json
        id: url
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ steps.apk.outputs.file }}"
          echo "Checking $URL"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sIL -o /dev/null -w "%{http_code}" "$URL")
            echo "attempt $i -> HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 6
          done
          [ "$CODE" = "200" ] || { echo "::error::Release asset not reachable; version.json NOT updated"; exit 1; }
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"

      # UpdateManager reads version.json from main with these exact keys:
      # version_code, version_name, download_url
      - name: Update version.json on main
        env:
          NEW_CODE: ${{ steps.ver.outputs.code }}
          NEW_NAME: ${{ steps.ver.outputs.name }}
          NEW_URL: ${{ steps.url.outputs.download_url }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main

            # Never roll OTA backwards if an older tag is re-pushed
            CUR=$(grep -oE '"version_code"[[:space:]]*:[[:space:]]*[0-9]+' version.json 2>/dev/null | grep -oE '[0-9]+$' || echo 0)
            if [ "${CUR:-0}" -ge "$NEW_CODE" ]; then
              echo "version.json already at versionCode $CUR (>= $NEW_CODE); nothing to do"
              exit 0
            fi

            cat > version.json <<JSON
          {
            "version_code": $NEW_CODE,
            "version_name": "$NEW_NAME",
            "download_url": "$NEW_URL"
          }
          JSON
            python3 -c "import json;print(json.load(open('version.json')))"

            git add version.json
            git commit -m "chore(ota): version.json -> $TAG [skip ci]"
            if git push origin main; then
              echo "version.json pushed"; exit 0
            fi
            echo "push rejected (main moved), retrying ($attempt/3)"
            sleep 5
          done
          echo "::error::Could not push version.json after 3 attempts"; exit 1

      - name: Remove keystore
        if: always()
        run: rm -f app/thieves_trap.jks
